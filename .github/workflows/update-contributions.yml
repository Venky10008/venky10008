name: Update Contribution Matrix

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'assets/contributions.svg'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate contribution matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER_NAME: ${{ github.repository_owner }}
          OUTPUT_PATH: assets/contributions.svg
        run: python3 .github/scripts/generate_contributions.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo 'No contribution changes to commit.'
          else
            git commit -m 'chore: refresh contribution matrix'
            git push
          fi
